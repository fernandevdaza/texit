packages:
  - apps/*
  - packages/*
allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true
minimumReleaseAgeExclude:
  - '@ai-sdk/anthropic@4.0.74'
  - '@ai-sdk/gateway@4.0.106'
  - '@ai-sdk/google@4.0.90'
  - '@ai-sdk/mcp@2.0.69'
  - '@ai-sdk/openai-compatible@3.0.65'
  - '@ai-sdk/openai@4.0.86'
  - '@ai-sdk/provider-utils@5.0.56'
  - '@ai-sdk/provider@4.0.24'
  - '@codemirror/language@6.13.1'
  - '@codemirror/legacy-modes@6.5.5'
  - '@codemirror/streamparser@6.0.0'
  - '@codemirror/view@6.43.14'
  - ai@7.0.130
  - electron@44.6.0
overrides:
  katex: ^0.19.0
auditConfig:
  # sprintf-js <=1.1.3 (GHSA-hp3w-g68c-fv3c): build-time only, via
  # electron-builder > @electron/get > global-agent > roarr. Not shipped in the web app or the
  # installers, and its format strings are fixed log messages. No patched release exists yet
  # (1.1.3 is the latest on npm). Remove this entry once electron-builder drops roarr 2.x or
  # sprintf-js 1.1.4 is published.
  ignoreGhsas:
    - GHSA-hp3w-g68c-fv3c
