<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0b0b0f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="description" content="TexIt — open-source, local-first, collaborative LaTeX editor with AI agents." />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <title>TexIt</title>
    <script>
      // Apply the theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('texit:settings') || '{}');
        var t = (s.state && s.state.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
